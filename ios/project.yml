# Orbital Harmony — iOS app (MVP)
#
# Generates OrbitalHarmony.xcodeproj via XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Run `xcodegen generate` from this directory after installing xcodegen
# (`brew install xcodegen`) — see README.md for the full workflow.
name: OrbitalHarmony
options:
  bundleIdPrefix: com.orbitalharmony
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only for this MVP
    ENABLE_PREVIEWS: YES
targets:
  OrbitalHarmony:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: OrbitalHarmony/App
      - path: OrbitalHarmony/Resources/Assets.xcassets
      # Added as a real "folder reference" (not a flattened group) so the
      # bundled web build's own relative/absolute asset paths
      # (assets/, textures/) still resolve correctly on disk inside the
      # app bundle — see LocalFileSchemeHandler.swift for why this matters.
      - path: OrbitalHarmony/Resources/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: OrbitalHarmony
        PRODUCT_BUNDLE_IDENTIFIER: com.orbitalharmony.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Info.plist is hand-authored (Resources/Info.plist), not
        # generated by XcodeGen, so it keeps our custom launch-screen/
        # status-bar/orientation keys exactly as written.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OrbitalHarmony/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
    # Ensures a shared OrbitalHarmony.xcscheme is written to disk (and
    # checked into git) so the project is immediately runnable/buildable
    # right after cloning/opening, instead of relying on Xcode's "Autocreate
    # Schemes" preference to generate one on first open.
    scheme: {}
