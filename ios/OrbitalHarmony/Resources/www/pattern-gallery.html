<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Orbital Harmony — Pattern Gallery</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #05060a; color: #e7ebf6; font: 13px/1.4 'Funnel Display', system-ui, sans-serif; }
    header { padding: 18px 16px 6px; }
    header h1 { margin: 0; font-size: 18px; letter-spacing: 0.04em; font-weight: 600; }
    header p { margin: 4px 0 0; color: #8b95b5; font-size: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; padding: 12px 16px 40px; }
    figure { margin: 0; text-align: center; background: #0a0c14; border: 1px solid #161a28; border-radius: 12px; padding: 8px; }
    canvas { background: #000; border-radius: 8px; width: 100%; aspect-ratio: 1; display: block; }
    figcaption { padding: 8px 2px 2px; }
    figcaption b { font-weight: 600; text-transform: capitalize; letter-spacing: 0.02em; }
    figcaption .meta { display: block; color: #7f8aad; font-size: 11px; margin-top: 3px; }
  </style>
</head>
<body>
  <header>
    <h1>Orbital Harmony — Pattern Gallery</h1>
    <p>All 28 planet-pair resonance geometries, rendered exactly as the app draws them (real periods, whole-loop clean closure, adaptive density &amp; opacity).</p>
  </header>
  <div class="grid" id="grid"></div>
  <script type="module">
    import { PLANETS, PLANETS_BY_KEY } from '/src/data/planets.js';
    import { currentOrbitAngleRad } from '/src/utils/currentPosition.js';
    import { computePatternPlan, PATTERN_LINE_WIDTH } from '/src/utils/resonance.js';

    const DPY = 365.25, TWO_PI = Math.PI * 2;
    // Same tight "pattern layout" orbit radii the engine remaps to.
    const LEGACY = { mercury:16, venus:21, earth:25, mars:31, jupiter:42, saturn:55, uranus:67, neptune:78 };

    // All unique pairs, ordered by closure span (calm → epic).
    const keys = PLANETS.map(p => p.key);
    const pairs = [];
    for (let i = 0; i < keys.length; i++)
      for (let j = i + 1; j < keys.length; j++)
        pairs.push([keys[i], keys[j]]);

    const S = 440, DPR = 2;
    function build(ka, kb) {
      const a = PLANETS_BY_KEY[ka], b = PLANETS_BY_KEY[kb];
      const p = computePatternPlan(a.orbitalPeriodDays, b.orbitalPeriodDays);
      const innerIsA = a.orbitalPeriodDays <= b.orbitalPeriodDays;
      const rIn = innerIsA ? LEGACY[ka] : LEGACY[kb];
      const rOut = innerIsA ? LEGACY[kb] : LEGACY[ka];
      const innerP = Math.min(a.orbitalPeriodDays, b.orbitalPeriodDays);
      const outerP = Math.max(a.orbitalPeriodDays, b.orbitalPeriodDays);
      const angIn = currentOrbitAngleRad(innerIsA ? a : b);
      const angOut = currentOrbitAngleRad(innerIsA ? b : a);
      const closureDays = p.totalSimYears * DPY;
      // Whole-loop clean closure (matches the engine's idealized rates).
      const tInner = Math.max(1, Math.round(closureDays / innerP));
      const tOuter = Math.max(1, Math.round(closureDays / outerP));

      const cv = document.createElement('canvas');
      cv.width = S * DPR; cv.height = S * DPR;
      const ctx = cv.getContext('2d');
      ctx.scale(DPR, DPR);
      const half = rOut * 1.06, scale = (S / 2) / half;
      ctx.translate(S / 2, S / 2);
      // faint orbit rings
      ctx.strokeStyle = 'rgba(120,140,200,0.14)'; ctx.lineWidth = 0.6;
      for (const r of [rIn, rOut]) { ctx.beginPath(); ctx.arc(0, 0, r * scale, 0, TWO_PI); ctx.stroke(); }
      // sun dot
      ctx.fillStyle = 'rgba(255,210,120,0.9)'; ctx.beginPath(); ctx.arc(0, 0, 2.4, 0, TWO_PI); ctx.fill();
      // pattern
      ctx.strokeStyle = `rgba(255,255,255,${(0.92 * p.lineOpacity).toFixed(3)})`;
      // Shared with the live engine via PATTERN_LINE_WIDTH so every pair
      // renders at the SAME stroke weight on both surfaces; round caps/joins
      // match the engine's smooth, even line quality.
      ctx.lineWidth = PATTERN_LINE_WIDTH;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      const stepF = 1 / p.chordCount;
      for (let i = 0; i <= p.chordCount; i++) {
        const f = i * stepF;
        const ai = angIn + f * tInner * TWO_PI;
        const ao = angOut + f * tOuter * TWO_PI;
        ctx.beginPath();
        ctx.moveTo(rIn * Math.cos(ai) * scale, -rIn * Math.sin(ai) * scale);
        ctx.lineTo(rOut * Math.cos(ao) * scale, -rOut * Math.sin(ao) * scale);
        ctx.stroke();
      }
      return { cv, p };
    }

    const grid = document.getElementById('grid');
    const rows = pairs.map(([ka, kb]) => {
      const a = PLANETS_BY_KEY[ka], b = PLANETS_BY_KEY[kb];
      return { ka, kb, years: computePatternPlan(a.orbitalPeriodDays, b.orbitalPeriodDays).totalSimYears };
    }).sort((x, y) => x.years - y.years);

    for (const { ka, kb } of rows) {
      const { cv, p } = build(ka, kb);
      const fig = document.createElement('figure');
      fig.appendChild(cv);
      const cap = document.createElement('figcaption');
      const yrs = p.totalSimYears >= 100 ? `${Math.round(p.totalSimYears)}` : p.totalSimYears.toFixed(1);
      cap.innerHTML = `<b>${ka} × ${kb}</b><span class="meta">${p.innerRevs}:${p.outerRevs} · ${p.petals} lobes · ${yrs} yr · ${p.chordCount} lines${p.lineOpacity < 0.99 ? ` · ${Math.round(p.lineOpacity*100)}% opacity` : ''}</span>`;
      fig.appendChild(cap);
      grid.appendChild(fig);
    }
    window.__done = true;
  </script>
</body>
</html>
